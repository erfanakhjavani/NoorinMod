name: noorin_mod


version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter



  cupertino_icons: ^1.0.6
  get: ^4.6.6
  gap: ^3.0.1
  flutter_spinkit: ^5.1.0
  dio: ^5.7.0
  lottie: ^3.2.0
  loading_animation_widget: ^1.3.0
  flutter_svg: ^2.0.16
  smooth_page_indicator: ^1.2.0+3
  shimmer: ^3.0.0
  delayed_widget: ^1.1.2
  animations: ^2.0.11
  font_awesome_flutter: ^10.8.0
  icons_launcher: ^3.0.0
  persian_number_utility: ^1.1.4
  intl: ^0.18.0



dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^3.0.0
  build_runner:
  flutter_gen_runner: ^5.8.0


flutter_gen:
  output: lib/Core/Gen

flutter:

  uses-material-design: true

  assets:
    - assets/png/
    - assets/json/
    - assets/webp/
    - assets/jpg/

  fonts:
    - family: Irs
      fonts:
        - asset: assets/fonts/irs.ttf

    - family: bnazanin
      fonts:
        - asset: assets/fonts/irs.ttf

    - family: vazir
      fonts:
        - asset: assets/fonts/irs.ttf


icons_launcher:
  image_path: "assets/png/logo.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true



flutter_native_splash:
  android: true
  ios: true
  web: true

  color: "#ffffff"
  image: "assets/png/logo.png"


  android_12:
    image: "assets/png/logo.png"
    color: "#ffffff"

